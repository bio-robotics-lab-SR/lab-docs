site_name: Bio-Inspired Robotics Lab
site_description: Documentation for the lab's robot systems and shared infrastructure

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/lab.css
extra_javascript:
  - assets/js/anatomy.js

# To add a page: copy templates/robot-system.md into docs/systems/
# and add one line under "Robot systems" below. See README.md.
nav:
  - Home: index.md
  - Getting help: help.md
  - Lab rules: rules.md
  - Robot systems:
      - Thymio: systems/thymio.md
  - Infrastructure:
      - Overview: infrastructure/index.md
  - Suggest a change: suggest-a-change.md
